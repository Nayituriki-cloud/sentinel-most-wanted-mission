<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="#020617"/>

  <!-- Outer Ring Shield -->
  <circle cx="256" cy="256" r="216" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="12"/>

  <!-- Inner Tactical Octagon Ring -->
  <polygon points="256,60 395,118 452,256 395,394 256,452 117,394 60,256 117,118" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="8 8"/>

  <!-- Central Badge Crest -->
  <path d="M256 100 L380 156 C380 290 320 376 256 414 C192 376 132 290 132 156 Z" fill="#090d16" stroke="url(#goldGrad)" stroke-width="8"/>

  <!-- Gold Star In Center -->
  <polygon points="256,150 274,206 332,206 285,241 303,296 256,262 209,296 227,241 180,206 238,206" fill="url(#goldGrad)" stroke="#78350f" stroke-width="3"/>

  <!-- Eagle / Radar Wings -->
  <path d="M170 310 C210 330 256 340 256 340 C256 340 302 330 342 310 C322 344 290 370 256 384 C222 370 190 344 170 310 Z" fill="url(#amberGlow)"/>

  <!-- Top Banner Text: SENTINEL -->
  <text x="256" y="246" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="4" text-anchor="middle">MISSION</text>
  <text x="256" y="278" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="20" fill="#fbbf24" letter-spacing="3" text-anchor="middle">ASSISTANT</text>
</svg>
